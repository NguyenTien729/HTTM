name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: httm
          POSTGRES_PASSWORD: httm
          POSTGRES_DB: httm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U httm"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://httm:httm@localhost:5432/httm
      DEEPSEEK_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: pytest -q
