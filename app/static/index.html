<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      HTTM | Research Copilot
    </title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color-scheme: light;
        --bg: #f4f6fa;
        --surface: #fff;
        --ink: #182337;
        --muted: #617086;
        --line: #dce3ec;
        --primary: #3056d3;
        --soft: #eef2ff;
        --green: #15803d;
        --amber: #b7791f;
        --red: #c53030
      }

      * {
        box-sizing: border-box
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.55
      }

      button,
      input,
      select,
      textarea {
        font: inherit
      }

      button {
        cursor: pointer
      }

      button:disabled {
        opacity: .55;
        cursor: wait
      }

      .shell {
        max-width: 1180px;
        margin: auto;
        padding: 26px 22px 90px
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap
      }

      .brand {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -.6px
      }

      .brand span {
        color: var(--primary)
      }

      .sub {
        color: var(--muted);
        margin: 5px 0 24px
      }

      .layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 24px;
        align-items: start
      }

      .side {
        position: sticky;
        top: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px
      }

      .side h2 {
        font-size: 13px;
        margin: 0 0 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px
      }

      .navitem {
        padding: 9px 10px;
        border-radius: 9px;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 9px;
        align-items: center
      }

      .navitem.active {
        background: var(--soft);
        color: var(--primary);
        font-weight: 700
      }

      .navitem.done {
        color: var(--green)
      }

      .navnum {
        display: grid;
        place-items: center;
        flex: none;
        width: 23px;
        height: 23px;
        border: 1px solid var(--line);
        border-radius: 50%;
        font-size: 11px
      }

      .navitem.done .navnum {
        background: var(--green);
        color: white;
        border-color: var(--green)
      }

      .progress {
        height: 7px;
        background: var(--line);
        border-radius: 8px;
        overflow: hidden;
        margin: 16px 0 7px
      }

      .progress>div {
        height: 100%;
        width: 0;
        background: var(--primary);
        transition: width .25s
      }

      .progress-label {
        font-size: 12px;
        color: var(--muted)
      }

      .step {
        display: flex;
        gap: 13px;
        margin-bottom: 13px
      }

      .dot {
        flex: none;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: white;
        border: 2px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        margin-top: 15px
      }

      .step.done .dot {
        background: var(--green);
        color: white;
        border-color: var(--green)
      }

      .step.run .dot,
      .step.wait .dot {
        border-color: var(--primary);
        color: var(--primary)
      }

      .step.err .dot {
        background: var(--red);
        color: white;
        border-color: var(--red)
      }

      .card {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        padding: 17px 20px;
        box-shadow: 0 2px 9px #1a305009
      }

      .step.pending .card {
        opacity: .52
      }

      .step.wait .card,
      .step.run .card {
        border-color: #a8baf5;
        box-shadow: 0 0 0 3px #dce5ff
      }

      .ttl {
        font-weight: 750;
        font-size: 15px
      }

      .tag {
        font-size: 10px;
        color: #76510b;
        background: #fff0c5;
        padding: 3px 7px;
        border-radius: 12px;
        margin-left: 9px
      }

      .sum {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px
      }

      .body {
        margin-top: 12px
      }

      .body:empty {
        display: none
      }

      label.field {
        display: block;
        font-size: 12px;
        font-weight: 650;
        color: var(--muted);
        margin: 12px 0 5px
      }

      input:not([type=checkbox]):not([type=radio]),
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px 11px;
        background: white;
        color: var(--ink);
        outline: none
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px #3056d318
      }

      textarea {
        resize: vertical;
        min-height: 85px
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px
      }

      .row.three {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

      .btn,
      button {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: white;
        color: var(--ink);
        padding: 9px 14px;
        text-decoration: none;
        display: inline-block;
        margin-top: 10px
      }

      .btn.primary,
      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
        font-weight: 650
      }

      button+button {
        margin-left: 8px
      }

      .error {
        color: var(--red);
        white-space: pre-wrap;
        margin-top: 10px
      }

      .warning {
        background: #fff9e9;
        border: 1px solid #f3d9a3;
        color: #815b14;
        border-radius: 9px;
        padding: 10px 12px;
        margin: 10px 0
      }

      .info {
        background: var(--soft);
        padding: 10px 12px;
        border-radius: 9px;
        margin: 10px 0
      }

      .option {
        display: block;
        border: 1px solid var(--line);
        padding: 12px;
        border-radius: 10px;
        margin: 9px 0;
        cursor: pointer
      }

      .option:has(input:checked) {
        border-color: var(--primary);
        background: var(--soft)
      }

      .option small {
        display: block;
        color: var(--muted);
        margin: 3px 0 0 24px
      }

      .option input {
        margin-right: 8px
      }

      details {
        border: 1px solid var(--line);
        border-radius: 9px;
        margin: 9px 0;
        padding: 10px
      }

      summary {
        cursor: pointer;
        color: var(--primary);
        font-weight: 650
      }

      .pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin-top: 10px
      }

      .scroll {
        overflow: auto;
        max-width: 100%
      }

      table {
        border-collapse: collapse;
        font-size: 12px;
        min-width: 520px
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top
      }

      th {
        background: #f7f9fc
      }

      .papers {
        display: grid;
        gap: 9px;
        margin-top: 12px
      }

      .paper {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px
      }

      .paper strong {
        display: block
      }

      .paper small {
        display: block;
        color: var(--muted);
        margin: 3px 0
      }

      .paper a {
        color: var(--primary)
      }

      .pill {
        display: inline-block;
        background: var(--soft);
        color: var(--primary);
        border-radius: 14px;
        padding: 2px 7px;
        font-size: 11px;
        margin: 4px 5px 0 0
      }

      .muted {
        color: var(--muted)
      }

      ul {
        padding-left: 20px
      }

      .footer {
        color: var(--muted);
        font-size: 12px;
        margin: 22px 0
      }

      @media(max-width:850px) {
        .layout {
          grid-template-columns: 1fr
        }

        .side {
          position: static
        }

        .side nav {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr))
        }
      }

      @media(max-width:520px) {
        .shell {
          padding: 16px 12px 60px
        }

        .side nav {
          grid-template-columns: 1fr
        }

        .row,
        .row.three {
          grid-template-columns: 1fr
        }

        .card {
          padding: 13px
        }

        .brand {
          font-size: 20px
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="top">
        <div class="brand">
          HTTM
          <span>
            Research Copilot
          </span>
        </div>
        <button id="reset">
          ↻ Bắt đầu lại
        </button>
      </div>
      <p class="sub">
        Quy trình nghiên cứu khoa học có kiểm soát • Chỉ dừng ở những bước cần quyết định của bạn
      </p>
      <div class="layout">
        <aside class="side">
          <h2>
            Tiến trình nghiên cứu
          </h2>
          <label id="branch-control" style="display:none">
            Loại bản thảo
            <select id="project-paper-type">
              <option value="topic_research">Hướng A — nghiên cứu theo đề tài</option>
              <option value="original_research">Hướng B — nghiên cứu từ gap</option>
              <option value="review">Bài tổng quan tài liệu</option>
            </select>
            <small>Đổi luồng sẽ giữ tài liệu đã thu thập và các bản thảo đã lưu.</small>
          </label>
          <nav id="nav">
          </nav>
          <div class="progress">
            <div id="bar">
            </div>
          </div>
          <div id="progress-label" class="progress-label">
          </div>
          <p class="footer">
            Kết quả được lưu tạm trên trình duyệt này. Các bước đã hoàn tất không tự chạy lại khi tải trang.
          </p>
        </aside>
        <main id="steps">
        </main>
      </div>
    </div>
    <script>
      'use strict';
      const $ = s => document.querySelector(s);

      function el(tag, attrs = {}, ...children) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'class') e.className = v;
          else if (k === 'onclick') e.onclick = v;
          else if (k === 'value' && ['input', 'textarea', 'select'].includes(tag)) e.value = v;
          else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? '' :
            String(v))
        }
        for (const child of children.flat()) {
          if (child === null || child === undefined || child === false) continue;
          e.append(child instanceof Node ? child : document.createTextNode(String(child)))
        }
        return e
      }
      const field = (name, node) => el('div', {}, el('label', {
        class: 'field'
      }, name), node);
      const note = (s, kind = 'info') => el('div', {
        class: kind
      }, s);
      const list = items => el('ul', {}, (items || []).map(x => el('li', {}, String(x))));
      const detail = (name, value) => el('details', {}, el('summary', {}, name), el('div', {
        class: 'pre'
      }, value || 'Không có dữ liệu'));

      function tab(rows, cols) {
        return el('div', {
          class: 'scroll'
        }, el('table', {}, el('thead', {}, el('tr', {}, cols.map(c => el('th', {}, c)))), el(
        'tbody', {}, (rows || []).map(r => el('tr', {}, cols.map(c => el('td', {}, typeof r[c] ===
          'object' ? JSON.stringify(r[c]) : String(r[c] ?? ''))))))))
      }
      async function api(method, path, data) {
        let response;
        try {
          response = await fetch(path, {
            method,
            headers: data === undefined ? {} : {
              'Content-Type': 'application/json'
            },
            body: data === undefined ? undefined : JSON.stringify(data)
          })
        } catch (e) {
          throw Error('Không kết nối được API. Kiểm tra Docker và địa chỉ /ui/. ' + e.message)
        }
        if (!response.ok) {
          let msg = 'HTTP ' + response.status;
          try {
            const d = (await response.json()).detail;
            msg = typeof d === 'string' ? d : JSON.stringify(d) || msg
          } catch {}
          throw Error(msg)
        }
        return response
      }
      const json = async (m, p, b) => (await api(m, p, b)).json();
      const exportEndpoint = (c, format = 'pdf') => c.paperType === 'review'
        ? `/reviews/${c.reviewId}/export/${format}` : '/export/paper/' + c.rqId;

      function showPaperDownload(c, box, initialBlob = null) {
        let blob = initialBlob;
        const error = el('div', {class: 'error'});
        const button = el('button', {class: 'primary', onclick: async () => {
          button.disabled = true;
          error.textContent = '';
          button.textContent = 'Đang chuẩn bị PDF…';
          try {
            if (!blob) blob = await (await api('POST', exportEndpoint(c), c.paperExportOptions || {})).blob();
            if (!blob.size) throw Error('PDF trả về rỗng.');
            const url = URL.createObjectURL(blob);
            const link = el('a', {href: url, download: c.paperType === 'review' ? `review_${c.reviewId}.pdf` : `research_paper_rq_${c.rqId}.pdf`});
            document.body.append(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
          } catch (e) {
            error.textContent = e.message || String(e);
          } finally {
            button.disabled = false;
            button.textContent = '↓ Tải bài báo PDF';
          }
        }}, '↓ Tải bài báo PDF');
        box.replaceChildren(button, error, note('Bạn có thể tải lại PDF sau khi làm mới trang.'));
        if (c.paperType === 'review') {
          const word = el('button', {onclick: async () => {
            word.disabled = true;
            error.textContent = '';
            try {
              const data = await (await api('POST', exportEndpoint(c, 'docx'), c.paperExportOptions || {})).blob();
              const url = URL.createObjectURL(data);
              const link = el('a', {href: url, download: `review_${c.reviewId}.docx`});
              document.body.append(link); link.click(); link.remove();
              setTimeout(() => URL.revokeObjectURL(url), 60000);
            } catch (e) { error.textContent = e.message; }
            finally { word.disabled = false; }
          }}, '↓ Tải Word (.docx) để chỉnh sửa');
          box.append(word);
          box.append(el('button', {onclick: () => {
            c.reviewManualEdit = true;
            state.i = oldExportIndex + 1;
            state.sum.length = state.i;
            save();
            location.reload();
          }}, 'Chỉnh sửa nội dung (tùy chọn)'));
        }
      }

      function gate(box, label, fn) {
        return new Promise(resolve => {
          const error = el('div', {
            class: 'error'
          });
          const button = el('button', {
            class: 'primary',
            onclick: async () => {
              button.disabled = true;
              error.textContent = '';
              try {
                resolve(await fn())
              } catch (e) {
                error.textContent = e.message;
                button.disabled = false
              }
            }
          }, label);
          box.append(error, button)
        })
      }
      const KEY = 'httm_state_v2';
      let state;
      try {
        state = JSON.parse(localStorage.getItem(KEY))
      } catch {}
      if (!state || !Number.isInteger(state.i) || !state.ctx) state = {
        i: 0,
        ctx: {},
        sum: []
      };
      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(state))
        } catch {}
      };
      const steps = [{
        title: 'Lập kế hoạch — Nhập đề tài',
        section: 'Lập kế hoạch',
        input: true,
        async run(c, box) {
          const topic = el('textarea', {
            placeholder: 'Ví dụ: Tác động của AI đến kết quả học tập của sinh viên Việt Nam',
            value: c.topic || ''
          });
          const region = el('input', {
            placeholder: 'Vietnam, Southeast Asia… (để trống nếu không giới hạn)',
            value: c.region || ''
          });
          const lang = el('select', {}, el('option', {
            value: 'en'
          }, 'English — bài báo tiếng Anh'), el('option', {
            value: 'vi'
          }, 'Tiếng Việt — ngôn ngữ mong muốn'));
          lang.value = c.language || 'en';
          const count = el('input', {
            type: 'number',
            min: 1,
            max: 500,
            value: c.count || 30
          });
          const type = el('input', {
            placeholder: 'survey / experiment / review'
          });
          const paperType = el('select', {}, el('option', {value: 'topic_research'}, 'Hướng A — nghiên cứu và phân tích dữ liệu theo đề tài'),
            el('option', {value: 'original_research'}, 'Hướng B — câu hỏi và giả thuyết từ research gap'),
            el('option', {value: 'review'}, 'Bài tổng quan tài liệu (luồng riêng)'));
          paperType.value = c.paperType || 'topic_research';
          const venue = el('input', {
            placeholder: 'Tạp chí/hội nghị (tuỳ chọn)'
          });
          box.append(field('Chủ đề nghiên cứu *', topic), field('Loại bài báo', paperType), note(
            'Hướng A bám đúng đề tài, bỏ bước gap, rồi tìm và phân tích dữ liệu. Hướng B giữ luồng phát hiện và duyệt gap.'), field(
            'Quốc gia / khu vực nghiên cứu (Region)', region), note(
            'Nếu để trống Region, hệ thống có thể suy ra khu vực từ đề tài. Bộ lọc Region chỉ hoạt động khi backend đã cập nhật. Ngôn ngữ paper là ưu tiên trong plan, không phải bộ lọc bắt buộc.'
            ), el('div', {
            class: 'row three'
          }, field('Ngôn ngữ tài liệu', lang), field('Số bài báo mục tiêu', count), field(
            'Loại nghiên cứu', type)), field('Tạp chí mục tiêu (tuỳ chọn)', venue));
          return gate(box, 'Tạo Research Plan →', async () => {
            if (topic.value.trim().length < 5) throw Error('Đề tài phải có ít nhất 5 ký tự.');
            const n = Number(count.value);
            if (!Number.isInteger(n) || n < 1 || n > 500) throw Error(
              'Số paper phải từ 1 đến 500.');
            const payload = {
              topic: topic.value.trim(),
              region: region.value.trim() || null,
              language: lang.value,
              target_paper_count: n
            };
            payload.paper_type = paperType.value;
            if (type.value.trim()) payload.study_type = type.value.trim();
            if (venue.value.trim()) payload.target_venue = venue.value.trim();
            const r = await json('POST', '/plan', payload);
            if (!r.id || !r.plan) throw Error('API /plan không trả dữ liệu hợp lệ.');
            Object.assign(c, {
              pid: r.id,
              topic: payload.topic,
              region: payload.region,
              language: payload.language,
              count: n,
              plan: r.plan
            });
            c.paperType = r.paper_type || paperType.value;
            box.replaceChildren(note('Đã tạo project #' + r.id), el('div', {}, 'Khu vực: ' + (
              r.plan.region || 'Không giới hạn')), el('div', {}, 'Từ khóa: ' + (r.plan
              .keywords || []).join(', ')));
            return 'Project #' + r.id + ' • ' + (r.plan.region || 'không giới hạn khu vực')
          })
        }
      }, {
        title: 'Tìm kiếm tài liệu theo chủ đề',
        section: 'Tổng quan tài liệu',
        async run(c, box) {
          const r = await json('POST', '/search/' + c.pid);
          const papers = (r.papers || []).slice().sort((a, b) => (b.publication_date || String(b
            .year || '')).localeCompare(a.publication_date || String(a.year || '')));
          c.paperCount = papers.length;
          const region = c.plan?.region || c.region;
          box.append(note(
            'Kết quả được xếp mới nhất trước theo publication_date (nếu có), sau đó theo năm. ' +
            (region ? 'Khu vực yêu cầu: ' + region + '.' : 'Không giới hạn khu vực.')));
          if (!papers.length) box.append(note(
            'Không có bài báo phù hợp. Có thể cần mở rộng phạm vi thời gian hoặc điều chỉnh Region.',
            'warning'));
          const holder = el('div', {
            class: 'papers'
          });
          papers.forEach(p => {
            const item = el('article', {
              class: 'paper'
            }, el('strong', {}, p.title || 'Không có tiêu đề'), el('small', {}, [p
              .publication_date || p.year || 'Không rõ ngày', p.venue || '', p.source ||
              ''
            ].filter(Boolean).join(' • ')));
            if (p.doi) item.append(el('span', {
              class: 'pill'
            }, 'DOI: ' + p.doi));
            if (p.pdf_url) item.append(el('a', {
              href: p.pdf_url,
              target: '_blank',
              rel: 'noopener noreferrer'
            }, ' PDF toàn văn'));
            else if (p.url) item.append(el('a', {
              href: p.url,
              target: '_blank',
              rel: 'noopener noreferrer'
            }, ' Xem bài báo'));
            holder.append(item)
          });
          box.append(holder, detail('Truy vấn tìm kiếm', r.query_used || ''));
          return `Tìm thấy ${r.found||0}, lưu mới ${r.saved||0} bài • ${papers.length} bài hiển thị`
        }
      }, {
        title: 'Đọc và trích xuất bằng chứng',
        section: 'Tổng quan tài liệu',
        async run(c, box) {
          const r = await json('POST', '/analyze/' + c.pid);

            });
          }
          box.append(note('Đối chiếu nội dung với nguồn trước khi xác nhận. Chỉnh sửa sẽ tạo phiên bản mới và phải kiểm chứng lại.'));
          return gate(box, 'Lưu phiên bản và kiểm chứng →', async () => {
            const sections = {};
            for (const [key, paragraphs] of Object.entries(edits)) sections[key] = {paragraphs: paragraphs.map(p => ({
              text: p.text.value, evidence: p.links.filter(l => !l.omit.checked).map(l => ({
                source_id: l.source.value, paper_id: manuscript.evidence_sources.find(s => s.source_id === l.source.value).paper_id,
                quote: l.quote.value
              }))
            }))};
            c.review = await json('PUT', '/reviews/' + c.reviewId, {title: title.value, sections});
            c.reviewId = c.review.id;
            c.reviewManualEdit = false;
            box.replaceChildren(note('Đã lưu phiên bản #' + c.reviewId));
            return 'Phiên bản #' + c.reviewId + ' đã lưu';
          });
        }
      }, {
        title: 'Tự kiểm chứng và sửa bản thảo', section: 'Kiểm chứng khoa học', paperType: 'review', back: oldExportIndex+1,
        async run(c, box) {
          const report = await json('POST', '/reviews/' + c.reviewId + '/validate');
          const validation = report.validation;
          c.reviewId = report.id || c.reviewId;
          c.review = {...c.review, id: c.reviewId, status: report.status, validation,
            manuscript: report.manuscript || c.review.manuscript};
          save();
          const issues = [...(validation.errors || []).map(e => e.paragraph_id + ': ' + e.reason),
            ...(validation.semantic_decisions || []).filter(d => !d.supported).map(d => d.paragraph_id + ': ' + d.reason)];
          if (issues.length) box.append(list(issues));
          if (!validation.ok) throw Error('Hệ thống đã tự sửa và kiểm tra lại nhưng vẫn chưa đủ bằng chứng để xác nhận một số đoạn. Có thể thử lại tự động hoặc bổ sung nguồn/điều chỉnh phạm vi.');
          const rounds = validation.auto_repair?.rounds || 0;
          if (rounds) box.append(note('Đã tự chỉnh sửa và kiểm tra lại bản thảo trong ' + rounds + ' lượt.'));
          box.append(detail('Nội dung sau kiểm chứng', c.review.manuscript.sections.map(s => s.title + '\n' + s.paragraphs.map(p => p.text).join('\n\n')).join('\n\n')));
          box.append(note('Đã kiểm tra mã nguồn, trích đoạn, số liệu và đối chiếu nội dung bằng AI. Cần tác giả rà soát học thuật trước khi sử dụng.'));
          return 'Đạt kiểm chứng tự động • vẫn cần rà soát học thuật';
        }
      });
      // Migrate progress from the prior 16-step empirical workflow without losing its project.
      if (!state.workflowVersion) {
        if (state.ctx.pid && !state.ctx.paperType) state.ctx.paperType = 'original_research';
        if (state.i >= oldExportIndex) {
          if (state.sum[oldExportIndex]) state.sum[oldExportIndex+3] = state.sum[oldExportIndex];
          state.i += 3;
        }
        state.workflowVersion = 3;
        save();
      }
      const cards = [];
      const matchesBranch = (step) => (!step.paperType || step.paperType === (state.ctx.paperType || 'topic_research'))
        && (!step.paperTypes || step.paperTypes.includes(state.ctx.paperType || 'topic_research'));
      steps.forEach((step, i) => {
        const dot = el('div', {
            class: 'dot'
          }, i + 1),
          summary = el('div', {
            class: 'sum'
          }),
          body = el('div', {
            class: 'body'
          }),
          root = el('section', {
            class: 'step pending'
          }, dot, el('div', {
            class: 'card'
          }, el('div', {}, el('span', {
            class: 'ttl'
          }, step.title), step.input ? el('span', {
            class: 'tag'
          }, 'CẦN BẠN') : ''), summary, body));
        $('#steps').append(root);
        cards.push({
          root,
          dot,
          summary,
          body
        });
        const nav = el('div', {
          class: 'navitem'
        }, el('span', {
          class: 'navnum'
        }, i + 1), step.title);
        $('#nav').append(nav)
      });

      function update() {
        $('#branch-control').style.display = state.ctx.pid ? 'block' : 'none';
        $('#project-paper-type').value = state.ctx.paperType || 'original_research';
        $('#project-paper-type').disabled = !!document.querySelector('.step.run');
        cards.forEach((card, i) => {
          const skipped = !matchesBranch(steps[i])
            || (steps[i].reviewEditor && !state.ctx.reviewManualEdit);
          card.root.style.display = skipped ? 'none' : '';
          const stateClass = i < state.i ? 'done' : i === state.i ? 'active' : '';
          const n = $('#nav').children[i];
          n.style.display = skipped ? 'none' : '';
          n.className = 'navitem ' + stateClass;
          n.querySelector('.navnum').textContent = i < state.i ? '✓' : i + 1
        });
        const applicable = steps.map((s, i) => ({s,i})).filter(({s}) => matchesBranch(s) && (!s.reviewEditor || state.ctx.reviewManualEdit));
        const finished = applicable.filter(({i}) => i < state.i).length;
        $('#bar').style.width = (100 * finished / applicable.length) + '%';
        $('#progress-label').textContent = `${finished}/${applicable.length} bước đã hoàn tất`
      }

      function status(i, kind, summary) {
        const card = cards[i];
        card.root.className = 'step ' + kind;
        card.dot.textContent = kind === 'done' ? '✓' : kind === 'err' ? '!' : kind === 'wait' ? '?' : i +
          1;
        if (summary !== undefined) card.summary.textContent = summary;
        update()
      }
      steps.forEach((_, i) => {
        if (i < state.i) {
          status(i, 'done', state.sum[i] || 'Đã hoàn thành');
          if (i === steps.length - 1 && (state.ctx.rqId || state.ctx.reviewId)) {
            showPaperDownload(state.ctx, cards[i].body);
          }
        }
      });
      let busy = false;
      async function run() {
        if (busy) return;
        busy = true;
        while (state.i < steps.length) {
          const i = state.i,
            step = steps[i],
            card = cards[i];
          if (!matchesBranch(step)) {
            state.i++; save(); update(); continue;
          }
          if (step.reviewEditor && !state.ctx.reviewManualEdit) {
            state.i++; save(); update(); continue;
          }
          status(i, step.input ? 'wait' : 'run', step.input ? 'Đang chờ xác nhận' : 'Đang xử lý…');
          card.body.replaceChildren();
          card.root.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest'
          });
          try {
            const result = await step.run(state.ctx, card.body);
            state.sum[i] = result || 'Đã hoàn thành';
            status(i, 'done', state.sum[i]);
            state.i++;
            save();
            update()
          } catch (e) {
            status(i, 'err', 'Có lỗi xảy ra');
            card.body.append(el('div', {
              class: 'error'
            }, e.message || String(e)), el('button', {
              class: 'primary',
              onclick: () => {
                busy = false;
                run()
              }
            }, 'Thử lại'));
            if (step.back !== undefined) card.body.append(el('button', {
              onclick: () => {
                if (step.paperType === 'review') state.ctx.reviewManualEdit = true;
                state.i = step.back;
                state.sum.length = state.i;
                save();
                location.reload()
              }
            }, step.paperType === 'review' ? 'Quay lại chỉnh sửa bản thảo' : 'Quay lại bước chọn'));
            busy = false;
            return
          }
        }
        busy = false;
        $('#steps').append(el('button', {
          class: 'primary',
          onclick: () => $('#reset').click()
        }, 'Bắt đầu nghiên cứu mới'))
      }
      $('#reset').onclick = () => {
        if (confirm('Xóa tiến trình đang lưu trên trình duyệt và bắt đầu nghiên cứu mới?')) {
          localStorage.removeItem(KEY);
          location.reload()
        }
      };
      $('#project-paper-type').onchange = async event => {
        const nextType = event.target.value;
        event.target.disabled = true;
        try {
          await json('PATCH', '/plan/' + state.ctx.pid + '/paper-type', {paper_type: nextType});
          state.ctx.paperType = nextType;
          if (state.i >= 4) state.i = nextType === 'review' ? oldExportIndex : nextType === 'topic_research' ? 6 : 4;
          state.sum.length = state.i;
          save();
          location.reload();
        } catch (e) {
          event.target.value = state.ctx.paperType;
          event.target.disabled = false;
          alert(e.message || 'Không đổi được loại bài.');
        }
      };
      update();
      run();
    </script>
  </body>
</html>
