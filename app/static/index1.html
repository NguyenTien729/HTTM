<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Copilot — Demo</title>
<style>
:root{font-family:system-ui,Arial;color:#172235;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:32px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px;margin:0}.sub{color:#64748b}.step{display:flex;gap:14px;margin:12px 0}.dot{width:34px;height:34px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;flex:none;font-weight:700}.card{flex:1;background:white;border:1px solid #dbe3ef;border-radius:12px;padding:16px}.pending{opacity:.5}.done .dot{background:#16a34a;color:white}.run .dot{background:#2563eb;color:white}.wait .dot{background:#f59e0b;color:white}.err .dot{background:#dc2626;color:white}.ttl{font-weight:700}.sum{font-size:13px;color:#64748b}.body{margin-top:10px}.body:empty{display:none}label{display:block;margin:10px 0 4px;font-size:14px}input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px}input[type=radio]{width:auto}button{border:1px solid #cbd5e1;border-radius:8px;background:white;padding:9px 14px;cursor:pointer;font:inherit}button.pri{background:#2457d6;color:white;border-color:#2457d6}button:disabled{opacity:.6}.opt{display:block;border:1px solid #dbe3ef;border-radius:9px;padding:12px;margin:8px 0;cursor:pointer}.opt small{display:block;color:#64748b}.warn{color:#9a6700}.error{color:#b91c1c;white-space:pre-wrap}.tag{font-size:11px;background:#f59e0b;color:white;border-radius:20px;padding:3px 8px;margin-left:8px}.pre{white-space:pre-wrap;line-height:1.7}details{margin-top:10px}summary{color:#2457d6;cursor:pointer}.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}
</style></head><body><main><header><h1>Research Copilot</h1><button id="reset">Bắt đầu lại</button></header><p class="sub">Bản demo gồm 9 bước nghiên cứu, kết thúc sau Related Work. Các chức năng dataset và Discussion tạm thời không sử dụng.</p><div id="steps"></div></main><script>
const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e[k]=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat().filter(x=>x!==false&&x!=null))e.append(c.nodeType?c:document.createTextNode(c));return e}
async function J(method,path,body){const r=await fetch(path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});if(!r.ok){let d;try{d=(await r.json()).detail}catch{}throw Error(typeof d==="string"?d:d?JSON.stringify(d):"HTTP "+r.status)}return r.json()}
const det=(title,txt)=>h("details",{},h("summary",{},title),h("div",{class:"pre"},txt));
const lines=a=>h("ul",{},a.map(x=>h("li",{},x)));
const gate=(box,label,fn)=>new Promise(resolve=>{const err=h("div",{class:"error"});const b=h("button",{class:"pri",onclick:async()=>{b.disabled=true;err.textContent="";try{resolve(await fn())}catch(e){err.textContent=e.message;b.disabled=false}}},label);box.append(err,b)});
const KEY="httm_demo_v3";let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}})()||{i:0,ctx:{},sum:[]};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const STEPS=[
{t:"Nhập đề tài nghiên cứu",input:true,async run(c,box){const topic=h("textarea",{rows:3,placeholder:"Ví dụ: Tác động của AI đến năng suất sinh viên đại học"},c.topic||"");const lang=h("select",{},h("option",{value:"vi"},"Tiếng Việt"),h("option",{value:"en"},"English"));const n=h("input",{type:"number",min:1,max:500,value:30});const type=h("input",{placeholder:"survey / experiment / review (tùy chọn)"});box.append(h("label",{},"Đề tài"),topic,h("div",{class:"row"},h("div",{},h("label",{},"Ngôn ngữ"),lang),h("div",{},h("label",{},"Số paper mục tiêu"),n),h("div",{},h("label",{},"Loại nghiên cứu"),type)));return gate(box,"Bắt đầu",async()=>{if(topic.value.trim().length<5)throw Error("Nhập ít nhất 5 ký tự");const body={topic:topic.value.trim(),language:lang.value,target_paper_count:+n.value||30};if(type.value.trim())body.study_type=type.value.trim();const r=await J("POST","/plan",body);Object.assign(c,{pid:r.id,topic:body.topic,plan:r.plan});box.replaceChildren(h("div",{},"Project #"+r.id+" — "+(r.plan?.keywords||[]).join(", ")));return "Project #"+r.id})}},
{t:"Tìm tài liệu (OpenAlex)",async run(c,box){const r=await J("POST","/search/"+c.pid);box.append(det("Danh sách paper",(r.papers||[]).map(p=>"• "+p.title).join("\\n")));return `Tìm thấy ${r.found}, lưu mới ${r.saved} paper`}},
{t:"Phân tích từng paper",async run(c,box){const r=await J("POST","/analyze/"+c.pid);box.append(det("Phát hiện chính",(r.analyses||[]).map(a=>`• [${a.paper_id}] ${a.key_finding}`).join("\\n")));return `${r.total_analyzed} paper đã phân tích (${r.fulltext_used} full-text)`}},
{t:"Tổng hợp theo chủ đề (themes)",async run(c,box){const r=await J("POST","/synthesize/"+c.pid);box.append(lines((r.themes||[]).map(t=>`${t.name} (${(t.paper_ids||[]).length} paper)`)));return (r.themes||[]).length+" theme"}},
{t:"Phát hiện research gap",async run(c,box){const r=await J("POST",`/synthesize/${c.pid}/gaps`);c.gaps=r.gaps||[];return c.gaps.length+" gap được đề xuất"}},
{t:"Duyệt research gap",input:true,async run(c,box){if(!c.gaps?.length)throw Error("Không có research gap được đề xuất");box.append(h("div",{class:"warn"},"Hãy kiểm tra bằng chứng trước khi duyệt gap."));box.append(...c.gaps.map(g=>h("label",{class:"opt"},h("input",{type:"radio",name:"gap",value:g.id}),h("b",{},g.gap_type||"Gap")," — "+g.description,h("small",{},"RQ gợi ý: "+g.proposed_research_question),h("small",{},"Paper: "+(g.evidence_paper_ids||[]).join(", ")))));return gate(box,"Duyệt gap đã chọn",async()=>{const sel=box.querySelector('input[name="gap"]:checked');if(!sel)throw Error("Hãy chọn một gap");await J("POST",`/synthesize/${c.pid}/gaps/${sel.value}/approve`);c.gapId=+sel.value;box.replaceChildren(h("div",{},"Đã duyệt gap #"+c.gapId));return "Đã duyệt gap #"+c.gapId})}},
{t:"Sinh câu hỏi nghiên cứu & giả thuyết",async run(c,box){const r=await J("POST","/research-questions/gap/"+c.gapId),q=r.research_question;c.rqId=q.id;c.rq=q;box.append(h("div",{},h("b",{},"RQ: "),q.rq_text),q.variables?.length?lines(q.variables.map(v=>`${v.name} (${v.role})`)):"",q.hypotheses?.length?lines(q.hypotheses.map(x=>`${x.label}: ${x.statement}`)):"");return "RQ #"+q.id}},
{t:"Viết Introduction",async run(c,box){const r=(await J("POST","/write/introduction/"+c.rqId)).introduction;c.introduction=r;box.append(det("Nội dung",[r.background,r.problem_statement,r.existing_knowledge,r.literature_limitation,r.research_gap_statement,r.research_question_statement,r.contribution_statement].filter(Boolean).join("\\n\\n")));if(r.citations_invalid?.length)box.append(h("div",{class:"warn"},"Citation chưa hợp lệ: "+r.citations_invalid.join(", ")));return `${(r.citations_used||[]).length} citation hợp lệ`}},
{t:"Viết Related Work",async run(c,box){const r=(await J("POST","/write/related-work/"+c.rqId)).related_work;c.relatedWork=r;box.append(det("Nội dung",[...(r.theme_paragraphs||[]).map(t=>t.theme_name+"\\n"+t.paragraph),r.contradictions_paragraph,r.gap_paragraph].filter(Boolean).join("\\n\\n")));if(r.citations_invalid?.length)box.append(h("div",{class:"warn"},"Citation chưa hợp lệ: "+r.citations_invalid.join(", ")));return `${(r.citations_used||[]).length} citation hợp lệ`}},
{t:"Hoàn tất demo",async run(c,box){box.append(h("p",{},"Đã hoàn thành quy trình demo đến Related Work. Chưa thực hiện phân tích dataset, Discussion, Conclusion và xuất PDF."),h("button",{class:"pri",onclick:()=>{const intro=c.introduction||{},rw=c.relatedWork||{};const report=["RESEARCH COPILOT — DEMO","Đề tài: "+(c.topic||""),"Project: "+(c.pid||""),"Câu hỏi nghiên cứu: "+(c.rq?.rq_text||""),"","INTRODUCTION",...[intro.background,intro.problem_statement,intro.existing_knowledge,intro.literature_limitation,intro.research_gap_statement,intro.research_question_statement,intro.contribution_statement].filter(Boolean),"","RELATED WORK",...(rw.theme_paragraphs||[]).map(t=>t.theme_name+"\\n"+t.paragraph),rw.contradictions_paragraph||"",rw.gap_paragraph||""].join("\\n\\n");const url=URL.createObjectURL(new Blob([report],{type:"text/plain;charset=utf-8"}));const a=h("a",{href:url,download:"research_demo.txt"});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}},"Tải kết quả demo (.txt)"));return "Demo hoàn tất"}}
];
const cards=STEPS.map((st,i)=>{const dot=h("div",{class:"dot"},i+1),sum=h("div",{class:"sum"}),body=h("div",{class:"body"}),el=h("div",{class:"step pending"},dot,h("div",{class:"card"},h("span",{class:"ttl"},st.t),st.input?h("span",{class:"tag"},"cần bạn"):"",sum,body));$("#steps").append(el);return{el,dot,sum,body}});
function status(i,s,msg){const x=cards[i];x.el.className="step "+s;x.dot.textContent=s==="done"?"✓":s==="err"?"!":s==="wait"?"?":i+1;if(msg!=null)x.sum.textContent=msg}
STEPS.forEach((_,i)=>{if(i<S.i)status(i,"done",S.sum[i]||"")});
let busy=false;async function loop(){if(busy)return;busy=true;while(S.i<STEPS.length){const i=S.i,st=STEPS[i],card=cards[i];status(i,st.input?"wait":"run",st.input?"Cần bạn quyết định":"Đang chạy…");card.body.replaceChildren();card.el.scrollIntoView({behavior:"smooth",block:"center"});try{const sum=await st.run(S.ctx,card.body);S.sum[i]=sum||"";status(i,"done",S.sum[i]);S.i++;save()}catch(e){status(i,"err","Lỗi");card.body.append(h("div",{class:"error"},e.message),h("button",{class:"pri",onclick:()=>{busy=false;loop()}},"Thử lại"));busy=false;return}}busy=false;$("#steps").append(h("button",{class:"pri",onclick:()=>$("#reset").click()},"Bắt đầu nghiên cứu mới"))}
$("#reset").onclick=()=>{if(confirm("Xóa tiến trình và bắt đầu lại?")){localStorage.removeItem(KEY);location.reload()}};loop();
</script></body></html>
