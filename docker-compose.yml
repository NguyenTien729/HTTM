services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: httm
      POSTGRES_PASSWORD: httm
      POSTGRES_DB: httm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U httm"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://httm:httm@db:5432/httm
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
